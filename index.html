<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasi Runner - Interactive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --accent: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #4ade80;
      --warning: #facc15;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0284c7;
      --accent: #9333ea;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .logo-badge { font-size: 2.2rem; display: inline-block; animation: bounce 2s infinite; }
    h1 { color: var(--primary); font-size: 1.6rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .nav-tabs {
      display: flex;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .tab-content { display: none; animation: slideUp 0.35s ease; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card-title { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
    .card-val { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-top: 6px; }

    .btn-group { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:active { transform: scale(0.97); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Task / Delivery Form & List */
    .task-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .task-input-row {
      display: flex;
      gap: 8px;
    }

    .task-input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.05);
      color: var(--text);
      font-size: 0.9rem;
    }

    .task-list {
      list-style: none;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.1);
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .task-info { display: flex; flex-direction: column; gap: 2px; }
    .task-meta { font-size: 0.75rem; color: var(--muted); }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-actions { display: flex; gap: 6px; }

    .task-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
    }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }

    .avatar-option {
      font-size: 1.6rem;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
    }

    .avatar-option.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
    }

    .badges {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }

    .badge-item {
      text-align: center;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    .badge-item.unlocked { opacity: 1; }
    .badge-icon { font-size: 1.8rem; }
    .badge-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pop { animation: pop 0.2s ease-in-out; }
    @keyframes pop { 50% { transform: scale(1.25); color: var(--accent); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge" id="headerAvatar">🏃‍♂️</div>
      <h1 id="headerName">Kasi Runner</h1>
      <p>Interactive Web Dashboard</p>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('tasks', this)">Deliveries</button>
      <button class="tab-btn" onclick="switchTab('analytics', this)">Analytics</button>
      <button class="tab-btn" onclick="switchTab('profile', this)">Profile</button>
    </nav>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboard" class="tab-content active">
      <div class="grid">
        <div class="card">
          <div class="card-title">Earnings</div>
          <div class="card-val" style="color: var(--success);" id="totalEarnings">R0</div>
        </div>
        <div class="card">
          <div class="card-title">Distance</div>
          <div class="card-val" style="color: var(--warning);" id="totalDistance">0 km</div>
        </div>
        <div class="card">
          <div class="card-title">Status</div>
          <div class="card-val" style="color: var(--success);">Active</div>
        </div>
        <div class="card">
          <div class="card-title">Taps</div>
          <div class="card-val" id="clickCount">0</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 12px;">
        <div class="card-title">Milestone Badges</div>
        <div class="badges">
          <div class="badge-item" id="badge10">
            <div class="badge-icon">🥉</div>
            <div class="badge-label">10 Taps</div>
          </div>
          <div class="badge-item" id="badge50">
            <div class="badge-icon">🥈</div>
            <div class="badge-label">50 Taps</div>
          </div>
          <div class="badge-item" id="badge100">
            <div class="badge-icon">🏆</div>
            <div class="badge-label">100 Taps</div>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="handleClick()">Tap Me!</button>
        <button class="btn btn-outline" onclick="resetClick()">Reset</button>
      </div>
    </div>

    <!-- TAB 2: TASKS & DELIVERIES -->
    <div id="tasks" class="tab-content">
      <div class="card">
        <div class="card-title">Delivery & Earnings Log</div>
        
        <div class="task-form">
          <input type="text" id="taskInput" class="task-input" placeholder="Delivery title (e.g. Grocery Pickup)" />
          <div class="task-input-row">
            <input type="number" id="payInput" class="task-input" placeholder="Earnings (R)" min="0" step="1" />
            <input type="number" id="distInput" class="task-input" placeholder="Distance (km)" min="0" step="0.1" />
          </div>
          <button class="btn" style="padding: 10px; width: 100%;" onclick="addTask()">Add Delivery</button>
        </div>

        <ul id="taskList" class="task-list"></ul>
      </div>
    </div>

    <!-- TAB 3: ANALYTICS -->
    <div id="analytics" class="tab-content">
      <div class="card">
        <div class="card-title">Dashboard Overview Metrics</div>
        <div style="margin-top: 10px; height: 200px;">
          <canvas id="tapChart"></canvas>
        </div>
      </div>
    </div>

    <!-- TAB 4: PROFILE & SETTINGS -->
    <div id="profile" class="tab-content">
      <div class="card" style="margin-bottom: 12px;">
        <div class="card-title">Runner Profile</div>
        <input type="text" id="runnerNameInput" class="task-input" style="width: 100%; text-align: center; margin-top: 8px;" placeholder="Enter your name" onchange="saveProfile()" />
        
        <div style="margin-top: 12px;" class="card-title">Choose Avatar</div>
        <div class="avatar-picker">
          <span class="avatar-option" onclick="selectAvatar('🏃‍♂️')">🏃‍♂️</span>
          <span class="avatar-option" onclick="selectAvatar('⚡')">⚡</span>
          <span class="avatar-option" onclick="selectAvatar('🔥')">🔥</span>
          <span class="avatar-option" onclick="selectAvatar('🚀')">🚀</span>
          <span class="avatar-option" onclick="selectAvatar('👑')">👑</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Preferences</div>
        <button class="btn btn-outline" style="margin-top: 10px; width: 100%;" onclick="toggleTheme()">Toggle Dark / Light Mode</button>
      </div>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('kasi_taps')) || 0;
    let runnerName = localStorage.getItem('kasi_name') || 'Kasi Runner';
    let avatar = localStorage.getItem('kasi_avatar') || '🏃‍♂️';
    let tasks = JSON.parse(localStorage.getItem('kasi_tasks')) || [];

    document.getElementById('clickCount').innerText = count;
    document.getElementById('runnerNameInput').value = runnerName;
    document.getElementById('headerName').innerText = runnerName;
    document.getElementById('headerAvatar').innerText = avatar;

    if (localStorage.getItem('kasi_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    updateBadges();
    renderTasks();

    function handleClick() {
      count++;
      localStorage.setItem('kasi_taps', count);
      const valEl = document.getElementById('clickCount');
      valEl.innerText = count;

      valEl.classList.remove('pop');
      void valEl.offsetWidth;
      valEl.classList.add('pop');

      updateBadges();
      updateChart();
    }

    function resetClick() {
      count = 0;
      localStorage.setItem('kasi_taps', 0);
      document.getElementById('clickCount').innerText = 0;
      updateBadges();
      updateChart();
    }

    function updateBadges() {
      document.getElementById('badge10').classList.toggle('unlocked', count >= 10);
      document.getElementById('badge50').classList.toggle('unlocked', count >= 50);
      document.getElementById('badge100').classList.toggle('unlocked', count >= 100);
    }

    /* Delivery, Earnings & Distance Logic */
    function addTask() {
      const input = document.getElementById('taskInput');
      const payInput = document.getElementById('payInput');
      const distInput = document.getElementById('distInput');

      const text = input.value.trim();
      const pay = parseFloat(payInput.value) || 0;
      const dist = parseFloat(distInput.value) || 0;

      if (!text) return;

      tasks.push({ text: text, pay: pay, dist: dist, done: false });
      input.value = '';
      payInput.value = '';
      distInput.value = '';
      
      saveTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      saveTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
    }

    function saveTasks() {
      localStorage.setItem('kasi_tasks', JSON.stringify(tasks));
      renderTasks();
      updateChart();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      let earningsSum = 0;
      let distanceSum = 0;

      if (tasks.length === 0) {
        list.innerHTML = '<li style="color: var(--muted); text-align: center; font-size: 0.85rem; padding: 10px;">No deliveries logged yet.</li>';
      } else {
        tasks.forEach((task, index) => {
          if (task.done) {
            earningsSum += task.pay || 0;
            distanceSum += task.dist || 0;
          }

          const li = document.createElement('li');
          li.className = `task-item ${task.done ? 'completed' : ''}`;
          li.innerHTML = `
            <div class="task-info">
              <span class="task-title">${task.text}</span>
              <span class="task-meta">R${task.pay || 0} • ${task.dist || 0} km</span>
            </div>
            <div class="task-actions">
              <button class="task-btn" onclick="toggleTask(${index})">${task.done ? '↩️' : '✅'}</button>
              <button class="task-btn" onclick="deleteTask(${index})">🗑️</button>
            </div>
          `;
          list.appendChild(li);
        });
      }

      document.getElementById('totalEarnings').innerText = `R${earningsSum}`;
      document.getElementById('totalDistance').innerText = `${distanceSum.toFixed(1)} km`;
    }

    function selectAvatar(emoji) {
      avatar = emoji;
      localStorage.setItem('kasi_avatar', avatar);
      document.getElementById('headerAvatar').innerText = avatar;
      highlightAvatar();
    }

    function highlightAvatar() {
      document.querySelectorAll('.avatar-option').forEach(el => {
        el.classList.toggle('selected', el.innerText === avatar);
      });
    }
    highlightAvatar();

    function saveProfile() {
      const inputVal = document.getElementById('runnerNameInput').value.trim();
      runnerName = inputVal || 'Kasi Runner';
      localStorage.setItem('kasi_name', runnerName);
      document.getElementById('headerName').innerText = runnerName;
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('kasi_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('kasi_theme', 'light');
      }
    }

    /* Chart Setup */
    const ctx = document.getElementById('tapChart').getContext('2d');
    
    function getChartData() {
      const doneTasks = tasks.filter(t => t.done);
      const totalEarned = doneTasks.reduce((sum, t) => sum + (t.pay || 0), 0);
      const totalKm = doneTasks.reduce((sum, t) => sum + (t.dist || 0), 0);
      return [count, doneTasks.length, totalEarned, totalKm];
    }

    const tapChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Taps', 'Done', 'Earned (R)', 'Dist (km)'],
        datasets: [{
          label: 'Activity',
          data: getChartData(),
          backgroundColor: ['#38bdf8', '#4ade80', '#facc15', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });

    function updateChart() {
      if (tapChart) {
        tapChart.data.datasets[0].data = getChartData();
        tapChart.update();
      }
    }
  </script>
</body>
</html>
