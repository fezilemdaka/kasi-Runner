<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasi Runner - Interactive Dashboard</title>
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --accent: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0284c7;
      --accent: #9333ea;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .logo-badge { font-size: 2rem; display: inline-block; animation: bounce 2s infinite; }
    h1 { color: var(--primary); font-size: 1.6rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .nav-tabs {
      display: flex;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .tab-content { display: none; animation: slideUp 0.35s ease; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card-title { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
    .card-val { font-size: 1.6rem; font-weight: bold; color: var(--primary); margin-top: 6px; }

    .btn-group { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:active { transform: scale(0.97); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pop { animation: pop 0.2s ease-in-out; }
    @keyframes pop { 50% { transform: scale(1.25); color: var(--accent); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge">🚀</div>
      <h1>Kasi Runner</h1>
      <p>Interactive Web Dashboard</p>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('analytics', this)">Analytics</button>
      <button class="tab-btn" onclick="switchTab('settings', this)">Settings</button>
    </nav>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboard" class="tab-content active">
      <div class="grid">
        <div class="card">
          <div class="card-title">Status</div>
          <div class="card-val" style="color: #4ade80;">Active</div>
        </div>
        <div class="card">
          <div class="card-title">Taps</div>
          <div class="card-val" id="clickCount">0</div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="handleClick()">Tap Me!</button>
        <button class="btn btn-outline" onclick="resetClick()">Reset</button>
      </div>
    </div>

    <!-- TAB 2: ANALYTICS -->
    <div id="analytics" class="tab-content">
      <div class="card" style="margin-bottom: 12px;">
        <div class="card-title">Tap Activity Chart</div>
        <div style="margin-top: 10px; height: 180px;">
          <canvas id="tapChart"></canvas>
        </div>
      </div>
    </div>

    <!-- TAB 3: SETTINGS -->
    <div id="settings" class="tab-content">
      <div class="card">
        <div class="card-title">Theme Preferences</div>
        <button class="btn btn-outline" style="margin-top: 12px; width: 100%;" onclick="toggleTheme()">Toggle Dark / Light Mode</button>
      </div>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('kasi_taps')) || 0;
    document.getElementById('clickCount').innerText = count;

    // Load saved theme
    if (localStorage.getItem('kasi_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    function handleClick() {
      count++;
      localStorage.setItem('kasi_taps', count);
      const valEl = document.getElementById('clickCount');
      valEl.innerText = count;

      valEl.classList.remove('pop');
      void valEl.offsetWidth;
      valEl.classList.add('pop');

      updateChart();
    }

    function resetClick() {
      count = 0;
      localStorage.setItem('kasi_taps', 0);
      document.getElementById('clickCount').innerText = 0;
      updateChart();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('kasi_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('kasi_theme', 'light');
      }
    }

    // Chart.js Setup
    const ctx = document.getElementById('tapChart').getContext('2d');
    const tapChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Total Taps'],
        datasets: [{
          label: 'Count',
          data: [count],
          backgroundColor: '#38bdf8',
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });

    function updateChart() {
      tapChart.data.datasets[0].data = [count];
      tapChart.update();
    }
  </script>
</body>
</html>
