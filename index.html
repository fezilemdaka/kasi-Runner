<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasi Runner - Interactive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --accent: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0284c7;
      --accent: #9333ea;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .logo-badge { font-size: 2.2rem; display: inline-block; animation: bounce 2s infinite; }
    h1 { color: var(--primary); font-size: 1.6rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .nav-tabs {
      display: flex;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .tab-content { display: none; animation: slideUp 0.35s ease; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card-title { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
    .card-val { font-size: 1.6rem; font-weight: bold; color: var(--primary); margin-top: 6px; }

    .btn-group { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:active { transform: scale(0.97); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }

    .avatar-option {
      font-size: 1.6rem;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
    }

    .avatar-option.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
    }

    .badges {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }

    .badge-item {
      text-align: center;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    .badge-item.unlocked { opacity: 1; }
    .badge-icon { font-size: 1.8rem; }
    .badge-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.1);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      margin-top: 8px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pop { animation: pop 0.2s ease-in-out; }
    @keyframes pop { 50% { transform: scale(1.25); color: var(--accent); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge" id="headerAvatar">🏃‍♂️</div>
      <h1 id="headerName">Kasi Runner</h1>
      <p>Interactive Web Dashboard</p>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('analytics', this)">Analytics</button>
      <button class="tab-btn" onclick="switchTab('profile', this)">Profile</button>
    </nav>

    <!-- DASHBOARD -->
    <div id="dashboard" class="tab-content active">
      <div class="grid">
        <div class="card">
          <div class="card-title">Status</div>
          <div class="card-val" style="color: #4ade80;">Active</div>
        </div>
        <div class="card">
          <div class="card-title">Taps</div>
          <div class="card-val" id="clickCount">0</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 12px;">
        <div class="card-title">Milestone Badges</div>
        <div class="badges">
          <div class="badge-item" id="badge10">
            <div class="badge-icon">🥉</div>
            <div class="badge-label">10 Taps</div>
          </div>
          <div class="badge-item" id="badge50">
            <div class="badge-icon">🥈</div>
            <div class="badge-label">50 Taps</div>
          </div>
          <div class="badge-item" id="badge100">
            <div class="badge-icon">🏆</div>
            <div class="badge-label">100 Taps</div>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="handleClick()">Tap Me!</button>
        <button class="btn btn-outline" onclick="resetClick()">Reset</button>
      </div>
    </div>

    <!-- ANALYTICS -->
    <div id="analytics" class="tab-content">
      <div class="card">
        <div class="card-title">Milestone Progress</div>
        <div style="margin-top: 10px; height: 180px;">
          <canvas id="tapChart"></canvas>
        </div>
      </div>
    </div>

    <!-- PROFILE & SETTINGS -->
    <div id="profile" class="tab-content">
      <div class="card" style="margin-bottom: 12px;">
        <div class="card-title">Runner Profile</div>
        <input type="text" id="runnerNameInput" placeholder="Enter your name" onchange="saveProfile()" />
        
        <div style="margin-top: 12px;" class="card-title">Choose Avatar</div>
        <div class="avatar-picker">
          <span class="avatar-option" onclick="selectAvatar('🏃‍♂️')">🏃‍♂️</span>
          <span class="avatar-option" onclick="selectAvatar('⚡')">⚡</span>
          <span class="avatar-option" onclick="selectAvatar('🔥')">🔥</span>
          <span class="avatar-option" onclick="selectAvatar('🚀')">🚀</span>
          <span class="avatar-option" onclick="selectAvatar('👑')">👑</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Preferences</div>
        <button class="btn btn-outline" style="margin-top: 10px; width: 100%;" onclick="toggleTheme()">Toggle Dark / Light Mode</button>
      </div>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('kasi_taps')) || 0;
    let runnerName = localStorage.getItem('kasi_name') || 'Kasi Runner';
    let avatar = localStorage.getItem('kasi_avatar') || '🏃‍♂️';

    document.getElementById('clickCount').innerText = count;
    document.getElementById('runnerNameInput').value = runnerName;
    document.getElementById('headerName').innerText = runnerName;
    document.getElementById('headerAvatar').innerText = avatar;

    if (localStorage.getItem('kasi_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    updateBadges();

    function handleClick() {
      count++;
      localStorage.setItem('kasi_taps', count);
      const valEl = document.getElementById('clickCount');
      valEl.innerText = count;

      valEl.classList.remove('pop');
      void valEl.offsetWidth;
      valEl.classList.add('pop');

      updateBadges();
      updateChart();
    }

    function resetClick() {
      count = 0;
      localStorage.setItem('kasi_taps', 0);
      document.getElementById('clickCount').innerText = 0;
      updateBadges();
      updateChart();
    }

    function updateBadges() {
      document.getElementById('badge10').classList.toggle('unlocked', count >= 10);
      document.getElementById('badge50').classList.toggle('unlocked', count >= 50);
      document.getElementById('badge100').classList.toggle('unlocked', count >= 100);
    }

    function selectAvatar(emoji) {
      avatar = emoji;
      localStorage.setItem('kasi_avatar', avatar);
      document.getElementById('headerAvatar').innerText = avatar;
      highlightAvatar();
    }

    function highlightAvatar() {
      document.querySelectorAll('.avatar-option').forEach(el => {
        el.classList.toggle('selected', el.innerText === avatar);
      });
    }
    highlightAvatar();

    function saveProfile() {
      const inputVal = document.getElementById('runnerNameInput').value.trim();
      runnerName = inputVal || 'Kasi Runner';
      localStorage.setItem('kasi_name', runnerName);
      document.getElementById('headerName').innerText = runnerName;
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('kasi_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('kasi_theme', 'light');
      }
    }

    const ctx = document.getElementById('tapChart').getContext('2d');
    const tapChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Target 10', 'Target 50', 'Target 100', 'Your Taps'],
        datasets: [{
          label: 'Progress',
          data: [10, 50, 100, count],
          backgroundColor: ['#94a3b8', '#94a3b8', '#94a3b8', '#38bdf8'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });

    function updateChart() {
      if (tapChart) {
        tapChart.data.datasets[0].data = [10, 50, 100, count];
        tapChart.update();
      }
    }
  </script>
</body>
</html>
